# Настройки сервиса. Если файла нет, используются те же значения по умолчанию.

# домен в короткой ссылке
short.domain=clck.ru

# длина короткого кода
short.code-length=6

# время жизни ссылки в секундах (86400 = сутки, 3600 = час)
link.ttl-seconds=86400

# лимит переходов по умолчанию и максимальный лимит
link.default-limit=10
link.max-limit=1000

# как часто проверять просроченные ссылки (секунды)
cleanup.interval-seconds=5
